name: Build desktop exe
on:
  workflow_dispatch:
  push:
    branches: [desktop-app]
    paths: ['desktop/**']
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: AlbuminTrak-exe
          path: desktop/dist/AlbuminTrak.exe
